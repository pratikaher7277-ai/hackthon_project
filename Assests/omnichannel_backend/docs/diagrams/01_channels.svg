<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Helvetica, Arial, sans-serif">
<title>Company X and its five channels</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="470" fill="#ffffff"/>
<text x="380" y="28" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Modes of interaction between Company X and customers</text>
<rect x="310" y="190" width="140" height="56" rx="8" fill="#ede9fe" stroke="#475569" stroke-width="1.2"/>
<text x="380.0" y="222.0" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Company X</text>
<rect x="40" y="70" width="140" height="52" rx="8" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/>
<text x="110.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">A: Instagram</text>
<line x1="315" y1="205" x2="190" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="330" width="140" height="52" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.2"/>
<text x="110.0" y="360.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">B: Website</text>
<line x1="315" y1="232" x2="190" y2="356" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="310" y="385" width="140" height="52" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="1.2"/>
<text x="380.0" y="415.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">C: Campaigns</text>
<line x1="380" y1="246" x2="380" y2="385" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="580" y="330" width="140" height="52" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="1.2"/>
<text x="650.0" y="360.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">D: Mobile App</text>
<line x1="445" y1="232" x2="580" y2="356" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="580" y="70" width="140" height="52" rx="8" fill="#dbeafe" stroke="#475569" stroke-width="1.2"/>
<text x="650.0" y="100.0" font-size="13" text-anchor="middle" fill="#1f2937" font-weight="bold">E: Blogs / Offline</text>
<line x1="445" y1="205" x2="580" y2="96" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<circle cx="250" cy="138" r="11" fill="#ffffff" stroke="#475569"/>
<text x="250" y="142" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">A</text>
<circle cx="250" cy="300" r="11" fill="#ffffff" stroke="#475569"/>
<text x="250" y="304" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">B</text>
<circle cx="392" cy="320" r="11" fill="#ffffff" stroke="#475569"/>
<text x="392" y="324" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">C</text>
<circle cx="510" cy="300" r="11" fill="#ffffff" stroke="#475569"/>
<text x="510" y="304" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">D</text>
<circle cx="510" cy="138" r="11" fill="#ffffff" stroke="#475569"/>
<text x="510" y="142" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">E</text>
<text x="380" y="455" font-size="13" text-anchor="middle" fill="#6b7280">Problem: each channel yields data in its own format and its own satisfaction rate.</text>
</svg>