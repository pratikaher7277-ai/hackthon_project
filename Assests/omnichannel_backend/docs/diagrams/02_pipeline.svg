<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" font-family="Helvetica, Arial, sans-serif">
<title>Three-part pipeline</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="920" height="400" fill="#ffffff"/>
<text x="460" y="28" font-size="16" text-anchor="middle" fill="#1f2937" font-weight="bold">Solution pipeline: Part A, Part B, Part C</text>
<rect x="20" y="50" width="260" height="300" rx="12" fill="#dbeafe" stroke="#475569" stroke-width="1.2"/>
<text x="150" y="78" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Part A: Agentic scan</text>
<rect x="330" y="50" width="260" height="300" rx="12" fill="#dcfce7" stroke="#475569" stroke-width="1.2"/>
<text x="460" y="78" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Part B: Evaluation system</text>
<rect x="640" y="50" width="260" height="300" rx="12" fill="#fef3c7" stroke="#475569" stroke-width="1.2"/>
<text x="770" y="78" font-size="14" text-anchor="middle" fill="#1f2937" font-weight="bold">Part C: Transfer to frontend</text>
<rect x="40" y="92" width="220" height="28" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="150.0" y="110.0" font-size="12" text-anchor="middle" fill="#1f2937">Agent A: Instagram</text>
<rect x="40" y="126" width="220" height="28" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="150.0" y="144.0" font-size="12" text-anchor="middle" fill="#1f2937">Agent B: Website</text>
<rect x="40" y="160" width="220" height="28" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="150.0" y="178.0" font-size="12" text-anchor="middle" fill="#1f2937">Agent C: Campaigns</text>
<rect x="40" y="194" width="220" height="28" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="150.0" y="212.0" font-size="12" text-anchor="middle" fill="#1f2937">Agent D: Mobile App</text>
<rect x="40" y="228" width="220" height="28" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="150.0" y="246.0" font-size="12" text-anchor="middle" fill="#1f2937">Agent E: Blogs / Offline</text>
<text x="150" y="280" font-size="12" text-anchor="middle" fill="#6b7280">Parallel, retried, failure-isolated</text>
<text x="150" y="297" font-size="12" text-anchor="middle" fill="#6b7280">Normalise every scale to 0-1</text>
<text x="150" y="314" font-size="12" text-anchor="middle" fill="#6b7280">Output: one snapshot per channel</text>
<rect x="350" y="92" width="220" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="460.0" y="111.0" font-size="12" text-anchor="middle" fill="#1f2937">Checks: reliability, freshness,</text>
<text x="460.0" y="127.0" font-size="12" text-anchor="middle" fill="#1f2937">completeness</text>
<rect x="350" y="150" width="220" height="30" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="460.0" y="169.0" font-size="12" text-anchor="middle" fill="#1f2937">Gate: pass / fail with reasons</text>
<rect x="350" y="190" width="220" height="30" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="460.0" y="209.0" font-size="12" text-anchor="middle" fill="#1f2937">Adjust small samples (shrinkage)</text>
<rect x="350" y="230" width="220" height="30" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="460.0" y="249.0" font-size="12" text-anchor="middle" fill="#1f2937">Rank eligible by satisfaction</text>
<rect x="350" y="270" width="220" height="30" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="460.0" y="289.0" font-size="12" text-anchor="middle" fill="#1f2937">Is the lead statistically real?</text>
<rect x="350" y="310" width="220" height="30" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="460.0" y="329.0" font-size="12" text-anchor="middle" fill="#1f2937">Like-for-like effect (same customers)</text>
<rect x="660" y="92" width="220" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="770.0" y="119.0" font-size="12" text-anchor="middle" fill="#1f2937">JSON payload (schema 1.0)</text>
<rect x="660" y="150" width="220" height="32" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="770.0" y="170.0" font-size="12" text-anchor="middle" fill="#1f2937">Bar: satisfaction + interval</text>
<rect x="660" y="190" width="220" height="32" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="770.0" y="210.0" font-size="12" text-anchor="middle" fill="#1f2937">Grouped bar: data quality</text>
<rect x="660" y="230" width="220" height="32" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
<text x="770.0" y="250.0" font-size="12" text-anchor="middle" fill="#1f2937">Line: trend over time</text>
<rect x="660" y="275" width="220" height="46" rx="8" fill="#ede9fe" stroke="#475569" stroke-width="1.2"/>
<text x="770.0" y="294.0" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Frontend dashboard</text>
<text x="770.0" y="310.0" font-size="12" text-anchor="middle" fill="#1f2937">GET /api/v1/report</text>
<line x1="282" y1="200" x2="328" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="592" y1="200" x2="638" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
</svg>